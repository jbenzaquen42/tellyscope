name: iOS unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".gitattributes"
      - "app/src/helper/**"
      - "app/build.gradle.kts"
      - "gradle/**"
  push:
    branches: [codex/ios-port]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".gitattributes"
      - "app/src/helper/**"
      - "app/build.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

jobs:
  tv-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the original Tellyscope on-TV helper
        run: ./gradlew :app:dexLabelHelper --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: tellyscope-tv-helper
          path: app/build/generated/labelHelper/assets/label-helper.jar
          if-no-files-found: error
  build:
    needs: tv-helper
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tellyscope-tv-helper
          path: ios/iosadb/Resources

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Test TellyscopeCore
        run: swift test --package-path ios/TellyscopeCore

      - name: Test IPA packaging verifier
        run: python3 -m unittest discover -s ios/tests

      - name: Build for iPhone simulator
        run: >-
          xcodebuild -quiet -project ios/iosadb.xcodeproj -scheme TVADB
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/tellyscope-simulator"
          CODE_SIGNING_ALLOWED=NO build

      - name: Launch on a narrow iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; print(next(r["identifier"] for r in reversed(json.load(sys.stdin)["runtimes"]) if r["isAvailable"] and r["name"].startswith("iOS ")))')
          device=$(xcrun simctl create Tellyscope-Smoke com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$runtime")
          trap 'xcrun simctl shutdown "$device" || true; xcrun simctl delete "$device" || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/tellyscope-simulator/Build/Products/Debug-iphonesimulator/TVADB.app"
          xcrun simctl launch "$device" app.tellyscope.ios -AppleLanguages '(en)' -AppleLocale en_US -tvadb.autoScan NO
          sleep 3
          mkdir -p ios/dist
          xcrun simctl io "$device" screenshot ios/dist/iphone-13-mini.png
          xcrun simctl terminate "$device" app.tellyscope.ios
          xcrun simctl launch "$device" app.tellyscope.ios -AppleLanguages '(en)' -AppleLocale en_US -tvadb.autoScan NO -TVADBSimulateConnectedDevice
          sleep 3
          xcrun simctl io "$device" screenshot ios/dist/overview-preview.png
          xcrun simctl terminate "$device" app.tellyscope.ios
          xcrun simctl launch "$device" app.tellyscope.ios -AppleLanguages '(en)' -AppleLocale en_US -tvadb.autoScan NO -TVADBSimulateConnectedDevice -TellyscopePreviewRemote
          sleep 3
          xcrun simctl io "$device" screenshot ios/dist/remote-preview.png

      - name: Build and verify unsigned IPA
        shell: bash
        run: bash ios/scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA and receipts
        uses: actions/upload-artifact@v7
        with:
          name: TVADB-unsigned-${{ github.sha }}
          path: |
            ios/dist/TVADB-unsigned.ipa
            ios/dist/TVADB-unsigned.ipa.sha256
            ios/dist/TVADB-unsigned.ipa.provenance.json
            ios/dist/iphone-13-mini.png
            ios/dist/*-preview.png
          if-no-files-found: error
          retention-days: 14
